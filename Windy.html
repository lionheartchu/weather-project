<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Windy Field (Realtime) - Immersive Wind Visualization</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style_cloud.css" />

  <style>
    /* ===== 左侧实时信息面板（与 Cloudy 一致） ===== */
    #info-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(11, 14, 18, 0.85);
      border: 1px solid rgba(233, 238, 245, 0.2);
      border-radius: 8px;
      padding: 16px;
      max-width: 300px;
      color: #e9eef5;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      z-index: 10;
      pointer-events: auto;
    }
    #info-panel h2 {
      margin: 0 0 12px 0;
      font-size: 1.2em;
      border-bottom: 1px solid rgba(233, 238, 245, 0.3);
      padding-bottom: 8px;
    }
    #info-panel .kv {
      margin: 6px 0;
      font-size: 0.9em;
      line-height: 1.4;
    }
    #info-panel .kv b {
      display: inline-block;
      min-width: 80px;
      color: #a8d8ff;
    }
    small { opacity: 0.6; }

    /* ==== 去掉左下角说明：直接不写 mode-panel 样式 ==== */
  </style>
</head>

<body>
  <!-- 全屏画布 -->
  <canvas id="cloud-canvas"></canvas>

  <!-- 左侧实时天气信息 -->
  <div id="info-panel">
    <h2 id="city">Locating…</h2>
    <div class="kv"><b>Condition:</b> <span id="desc">—</span></div>
    <div class="kv"><b>Temp:</b> <span id="temp">—</span></div>
    <div class="kv"><b>Wind:</b> <span id="wind-v">—</span></div>
    <div class="kv"><b>Humidity:</b> <span id="humidity">—</span></div>
    <div class="kv"><b>Cloud:</b> <span id="cloud">—</span></div>
    <div class="kv"><b>PM2.5:</b> <span id="aqi">—</span></div>
  </div>

  <!-- 不再有底部的 mode-panel -->

  <script src="Windscript.js"></script>
</body>
</html>
